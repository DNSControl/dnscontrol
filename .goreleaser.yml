# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
project_name: dnscontrol
version: 2
builds:
  -
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - freebsd
# List of combinations of GOOS + GOARCH + GOARM to ignore.
    ignore:
      - goos: linux
        goarch: "386"
      - goos: windows
        goarch: "386"
      - goos: freebsd
        goarch: "386"
    ldflags:
      - -linkmode=internal -s -w
      - -X github.com/DNSControl/dnscontrol/v4/pkg/version.version={{ .Version }}
before:
  hooks:
    - go fmt ./...
    - go mod tidy
    - go generate ./...
changelog:
  sort: asc
  use: github
  # Grouping is driven by Conventional Commits (see issue #4829). Two rules to
  # know when editing this list:
  #   1. A commit lands in the FIRST group (by list order) whose regexp
  #      matches; `order:` only controls the DISPLAY position. So the
  #      provider-specific group must be LISTED before the generic feat/fix
  #      groups, and the catch-all "Other" group must be LISTED last.
  #   2. Provider-specific changes are identified by the "p/<name>" scope,
  #      e.g. "fix(p/route53): ...". This means there is NO per-provider list
  #      to maintain here: adding a new provider needs no changes to this file.
  groups:
    - title: 'Breaking changes:'
      regexp: '(?i)^[a-z]+(\([^)]*\))?!:|breaking change'
      order: 0
    - title: 'Provider-specific changes:'
      regexp: '(?i)^(feat|fix|refactor|perf)\(p/[^)]+\):'
      order: 2
    - title: 'New features:'
      regexp: '(?i)^feat(\([^)]*\))?:'
      order: 1
    - title: 'Bug fixes:'
      regexp: '(?i)^fix(\([^)]*\))?:'
      order: 3
    - title: 'Documentation:'
      regexp: '(?i)^docs(\([^)]*\))?:'
      order: 4
    - title: 'CI/CD:'
      regexp: '(?i)^(build|ci)(\([^)]*\))?:'
      order: 5
    - title: 'Dependencies:'
      regexp: '(?i)^\w+\([^)]*deps[^)]*\):|\bdependencies\b'
      order: 6
    - title: 'Deprecation warnings:'
      regexp: '(?i)deprecate'
      order: 8
    - title: 'Other changes and improvements:'
      order: 9
  filters:
    exclude:
    - '^test:'
    - Merge pull request
    - Merge branch
archives:
  - format_overrides:
    - goos: windows
      formats:
        - "zip"
universal_binaries:
  -
    replace: true

nfpms:
  - id: packages_rpm
    file_name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}.
      {{- if eq .Arch "386" }}i386
      {{- else if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    homepage:  https://docs.dnscontrol.org/
    description: "DNSControl: Infrastructure as Code for DNS Zones"
    maintainer: 'Tom Limoncelli <tal@whatexit.org>'
    license: MIT
    formats:
    - rpm
  - id: packages_deb
    file_name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}.
      {{- if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    homepage:  https://docs.dnscontrol.org/
    description: "DNSControl: Infrastructure as Code for DNS Zones"
    maintainer: 'Tom Limoncelli <tal@whatexit.org>'
    license: MIT
    formats:
    - deb
dockers_v2:
  - images:
      - "dnscontrol/{{.ProjectName}}"
      - "ghcr.io/dnscontrol/{{.ProjectName}}"
    tags:
      - "{{ .Version }}"
      - "{{ if and (not .IsSnapshot) (not .Prerelease) }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.name": "{{ .ProjectName }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"

homebrew_casks:
  -
    name: dnscontrol
    url:
      template: "https://github.com/DNSControl/dnscontrol/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Casks
    homepage: "https://docs.dnscontrol.org/"
    description: "DNSControl: Infrastructure as Code for DNS Zones"
    skip_upload: auto
    license: "MIT"
    repository:
      owner: DNSControl
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"

release:
  # Fully automated releases (issue #4829): publish immediately, no draft to
  # hand-edit. The human gate is the `develop -> main` merge, not note editing.
  draft: false
  prerelease: auto
  mode: append
  header: |
    Greetings DNS fans!

    Thanks to all contributors involved in this release! This is a community project and we couldn't do it without all of your contributions!

    Sincerely,
    --Tom Limoncelli

    ## Monthly video call!

    Everyone is invited to the __Monthly DNSControl Community Video Conference Call__ on the 2nd Tuesday of each  month. Join whether you are a new user with questions or an experienced developer that wants to discuss DNSControl internals... or anything in between! Meeting details on
    [GitHub Discussions](https://github.com/DNSControl/dnscontrol/discussions?discussions_q=label%3AAnnouncement%3Afuture_vc).

  footer: |
    ## Deprecation warnings

    > [!WARNING]
    > - **REV() will switch from RFC2317 to RFC4183 sometime after v5.0 is released.** This is a breaking change. Warnings are output if your configuration is affected. See https://docs.dnscontrol.org/language-reference/top-level-functions/revcompat
    > - **NAMEDOTCOM, OPENSRS and SOFTLAYER need maintainers!** These providers have no maintainer. Maintainers respond to PRs and fix bugs in a timely manner, and try to stay on top of protocol changes.

    ## Install

    #### macOS and Linux

    ##### Install with [Homebrew](https://brew.sh) (recommended)

    ```shell
    brew trust --formula dnscontrol/tap/dnscontrol
    brew install DNSControl/tap/dnscontrol
    ```

    ##### Using with [Docker](https://www.docker.com)

    You can use the Docker image from [Docker hub](https://hub.docker.com/r/dnscontrol/dnscontrol/) or [GitHub Container Registry](https://github.com/dnscontrol/dnscontrol/pkgs/container/dnscontrol).

    ```shell
    docker run --rm -it -v "$(pwd):/dns" ghcr.io/dnscontrol/dnscontrol preview
    ```

    #### Anywhere else

    Alternatively, you can install the latest binary (or the apt/rpm/deb/archlinux package) from this page.

    Or, if you have Go installed, you can install the latest version of DNSControl with the following command:

    ```shell
    go install github.com/DNSControl/dnscontrol/v4@main
    ```

    ## Update

    Update to the latest version depends on how you choose to install `dnscontrol` on your machine.

    #### Update with [Homebrew](https://brew.sh)

    ```shell
    brew upgrade DNSControl/tap/dnscontrol
    ```

    Alternatively, you can grab the latest binary (or the apt/rpm/deb package) from this page.
