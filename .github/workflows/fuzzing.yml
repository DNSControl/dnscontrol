name: "Fuzzing"

# Run the Go native fuzz targets (the fuzz/ package) for a fixed time
# budget.  The seed corpus already runs on every `go test ./...` (PR
# CI included); this workflow adds actual fuzzing on a schedule so
# the corpus accumulates and new crashers are found early.  Any input
# that crashes a target is written to fuzz/testdata/fuzz/<Target>/ by
# the fuzzer and uploaded as an artifact for triage; minimized
# crashers should be committed as regression seeds.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: "Fuzz ${{ matrix.target }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Run every target even if one finds a crasher.
      fail-fast: false
      matrix:
        target: [FuzzConfigJSON, FuzzTXTQuoted]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: "Restore fuzz corpus"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # GOCACHE holds the fuzzing corpus that accumulates across runs.
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: "Run fuzzing"
        run: go test ./fuzz/ -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 10m

      - name: "Upload crashers (if any)"
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: fuzz/testdata/fuzz/
          retention-days: 30