name: "RELEASE: Make release candidate"

# Two ways to cut a release:
#
# 1. Automated (recommended): Actions -> "RELEASE: Make release candidate" ->
#    "Run workflow". Pick the branch to release from (the "Use workflow from"
#    dropdown), enter the version, and optionally a previous tag. This runs the
#    FULL integration suite as a gate, then creates the empty "Release vX.Y.Z"
#    commit (via an auto-merged PR), tags it, and runs GoReleaser.
#
# 2. Manual escape hatch: push a tag (git push origin vX.Y.Z). That still runs
#    GoReleaser directly, exactly as before.
#
# Either way, GoReleaser produces a DRAFT release; the release job then
# cosign-signs checksums.txt (keyless, one Sigstore bundle) and uploads the
# bundle alongside the artifacts, the "provenance" job generates SLSA
# provenance (multiple.intoto.jsonl), and the "upload-provenance" job
# attaches it to the same draft. You edit the notes and click publish.

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-*

  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v4.44.0 or v4.44.0-rc1"
        required: true
        type: string
      previous_tag:
        description: "Previous release tag for the changelog (blank = auto-detect the most recent non-RC release)"
        required: false
        default: ""
        type: string
      skip_longtest:
        description: "Only do short-test"
        required: false
        default: false
        type: boolean
    # NOTE: the branch to release from is chosen via the "Use workflow from"
    # dropdown (github.ref) — that is how "release from any branch" works.

# Read-only by default. The `release` job grants itself the write
# permissions it needs (contents + packages) at the job level; preflight
# and verify never needed the workflow-wide write scopes. pull-requests
# was removed entirely: job-level permissions fully replace the
# workflow-level block, so the release job never had it, and this org
# forbids GitHub Actions from creating pull requests anyway.
permissions:
  contents: read

jobs:
  # preflight: validate the dispatch inputs before doing any real work.
  preflight:
    name: preflight
    if: github.repository == 'DNSControl/dnscontrol' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          set -eu
          if ! printf '%s' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'; then
            echo "::error::Invalid version '$VERSION'. Expected vX.Y.Z or vX.Y.Z-rcN."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists. Refusing to release."
            exit 1
          fi
          if [ -n "$PREVIOUS_TAG" ] && ! git rev-parse -q --verify "refs/tags/$PREVIOUS_TAG" >/dev/null; then
            echo "::error::previous_tag '$PREVIOUS_TAG' does not exist as a tag."
            exit 1
          fi
          echo "Preflight OK: version=$VERSION branch=${GITHUB_REF_NAME} previous_tag=${PREVIOUS_TAG:-<auto>}"

  # verify: run the FULL longtest integration suite as a release gate. Uses
  # workflow_call, which GITHUB_TOKEN is allowed to trigger (no PAT needed).
  # Skipped when the operator opts out via skip_longtest=true.
  verify:
    name: verify (full longtest)
    if: github.repository == 'DNSControl/dnscontrol' && github.event_name == 'workflow_dispatch' && !inputs.skip_longtest
    needs: preflight
    uses: ./.github/workflows/pr_integration_tests.yml
    with:
      full: true
    secrets: inherit

  # release: create the tag (dispatch only) and run GoReleaser.
  # Runs for a manual tag push (unchanged behavior) OR after a successful
  # dispatch+verify.
  release:
    name: draft release
    needs: [preflight, verify]
    # Runs for: a manual tag push (unchanged), OR a dispatch where preflight
    # passed AND (the longtest gate passed OR the operator opted out via
    # skip_longtest). preflight must always pass, so an invalid version or an
    # existing tag still blocks even when skip_longtest is set.
    if: >-
      always() &&
      github.repository == 'DNSControl/dnscontrol' &&
      ( github.event_name == 'push' ||
        ( github.event_name == 'workflow_dispatch' &&
          needs.preflight.result == 'success' &&
          ( needs.verify.result == 'success' || inputs.skip_longtest ) ) )
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      # Keyless cosign signing needs this job's OIDC identity token.
      id-token: write
    outputs:
      # Subject digests (base64 sha256sum) handed to the SLSA provenance job.
      hashes: ${{ steps.hash.outputs.hashes }}
      # The tag identifying the draft release; handed to the
      # upload-provenance job (gh resolves drafts by pending tag name).
      tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # dispatch: the branch chosen in the UI; tag push: the pushed tag.
          ref: ${{ github.ref }}
      # Why "fetch-depth: 0"?  To generate the release notes, we need the
      # full git history.  A shallow checkout would make release notes going
      # back one commit.

      # Make an opted-out longtest gate impossible to miss (annotation + summary).
      - name: Warn if longtest gate was skipped
        if: github.event_name == 'workflow_dispatch' && inputs.skip_longtest
        run: |
          echo "::warning title=longtest skipped::The full longtest integration gate was SKIPPED for ${{ inputs.version }} (skip_longtest=true)."
          {
            echo "## ⚠️ longtest integration gate SKIPPED"
            echo ""
            echo "Release \`${{ inputs.version }}\` was cut with **skip_longtest=true**"
          } >> "$GITHUB_STEP_SUMMARY"

      # DISPATCH ONLY: tag the tip of the selected branch and push the tag.
      #
      # We deliberately do NOT land an empty "Release vX.Y.Z" commit on the
      # branch: main is protected (PRs required, enforced for admins) and this
      # org forbids GitHub Actions from creating pull requests, so an
      # automated, PAT-free PR is impossible. Tagging is unaffected by branch
      # protection (no tag protection rules), and the changelog is still correct
      # because GORELEASER_PREVIOUS_TAG is computed by version below (it does
      # not rely on the tag sitting on its own commit). The annotated tag itself
      # carries the "Release vX.Y.Z" message.
      #
      # Pushing the tag with GITHUB_TOKEN intentionally does NOT re-trigger this
      # workflow's tag-push path, so there is no double release.
      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"

      # Stringer is needed because .goreleaser includes "go generate ./..."
      - name: Install stringer
        run: |
          go install golang.org/x/tools/cmd/stringer@latest

      # Compute the changelog's current/previous tags ourselves.
      #
      # GoReleaser's default picks the previous tag by commit ancestry, which
      # (a) breaks when a release and its release-candidate share a commit (it
      # walks past both to an older release), and (b) makes a final release's
      # notes span only back to its own -rc tag. Instead:
      #   * current tag  = the version being released.
      #   * previous tag = the user-supplied `previous_tag` if given, otherwise
      #     the most recent NON-rc release older than the current version, so
      #     release notes cover the full range since the last stable release.
      - name: Compute changelog previous/current tags
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            cur="$INPUT_VERSION"
          else
            cur="$GITHUB_REF_NAME"
          fi
          echo "GORELEASER_CURRENT_TAG=$cur" >> "$GITHUB_ENV"

          # Explicit override wins.
          if [ -n "${INPUT_PREVIOUS_TAG:-}" ]; then
            echo "GORELEASER_PREVIOUS_TAG=$INPUT_PREVIOUS_TAG" >> "$GITHUB_ENV"
            echo "current=$cur previous=$INPUT_PREVIOUS_TAG (user-specified)"
            exit 0
          fi

          # Auto-detect: list stable (non-prerelease) release tags plus the
          # current base version, version-sort ascending, print the tag
          # immediately before the base version.
          base="${cur%%-*}"   # strip any -rc suffix (v4.43.1-rc1 -> v4.43.1)
          prev="$(
            { git tag --list 'v[0-9]*.[0-9]*.[0-9]*'; echo "$base"; } \
              | awk '!/-/' \
              | sort -V -u \
              | awk -v base="$base" '$0==base{print prev; exit} {prev=$0}'
          )"
          if [ -n "$prev" ]; then
            echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"
            echo "current=$cur previous=$prev (most recent non-rc release)"
          else
            echo "No prior non-rc release found for $cur; letting GoReleaser auto-detect."
          fi

      # use GoReleaser to build for all platforms.
      - name: Goreleaser release
        id: release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # Resolve the tag that identifies the draft release GoReleaser just
      # created. Dispatch runs pass the version as an input (the workflow
      # itself runs on a branch ref); tag pushes have the tag in GITHUB_REF.
      # Exported as a job output so the upload-provenance job can reuse it.
      - name: Resolve release tag
        id: resolve-tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_VERSION"
          else
            tag="$REF_NAME"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Subject digests for the SLSA provenance generator: everything that
      # lands on the release page (archives, rpm/deb packages, checksums.txt).
      - name: Compute subject hashes for SLSA provenance
        id: hash
        run: |
          set -eu
          cd dist
          hashes="$(sha256sum -- *.tar.gz *.zip *.rpm *.deb checksums.txt | base64 -w0)"
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless (OIDC) signing: the signer identity is this workflow/job, so
      # there are no signing keys to manage. checksums.txt covers every
      # release artifact transitively, so signing it alone is sufficient and
      # keeps the release page tidy.
      #
      # cosign v3 (what cosign-installer v4.1.2 installs) writes the new
      # Sigstore bundle format when --bundle is passed and silently ignores
      # --output-signature / --output-certificate in that mode, so we pass
      # --bundle only. See https://goreleaser.com/blog/cosign-v3/
      - name: Sign checksums.txt with cosign (keyless)
        run: |
          set -eu
          cd dist
          cosign sign-blob --yes checksums.txt \
            --bundle checksums.txt.sigstore.json

      # Run the exact verification the release notes document (see the
      # "Verify downloads" footer in .goreleaser.yml) before anything is
      # uploaded: a signature that cannot be verified fails the release
      # instead of shipping. The regexp covers both entry paths (tag pushes
      # sign with a refs/tags/ identity, dispatches with refs/heads/).
      - name: Verify checksums.txt signature
        run: |
          set -eu
          cd dist
          test -f checksums.txt.sigstore.json
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity-regexp 'https://github\.com/DNSControl/dnscontrol/\.github/workflows/release_draft\.yml@refs/(tags|heads)/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # gh resolves draft releases by pending tag name (the REST by-tag
      # endpoint cannot), so this attaches to the DRAFT release; --clobber
      # makes re-runs idempotent. The verify step above already asserted the
      # bundle exists, so this cannot fail on a missing file after GoReleaser
      # has already published anything.
      - name: Upload cosign bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd dist
          gh release upload "$RELEASE_TAG" \
            checksums.txt.sigstore.json \
            --clobber

  # Generate SLSA Build Level 3 provenance for the release artifacts as
  # multiple.intoto.jsonl. This is what OpenSSF Scorecard's Signed-Releases
  # check recognizes; see also issue #3468.
  #
  # upload-assets MUST be false: the generator's built-in uploader cannot
  # attach to the GoReleaser draft in this repo. It uploads via
  # softprops/action-gh-release v2.2.1 (pinned by generator v2.1.0), whose
  # draft lookup paginates through ALL releases and reassigns its
  # found-release variable on every page -- only the LAST (oldest) page's
  # match survives. This repo has more than 100 releases, so the draft
  # (newest, page 1) is found and then overwritten by the last page, and the
  # action falls back to CREATING A SECOND DRAFT RELEASE for the same tag
  # instead of attaching to ours. Confirmed live in the first dry-run (run
  # 39435368847: two v5.5.99-rc1 drafts); the repo where this pattern was
  # validated has only 45 releases, so the buggy path never triggered there.
  # Tracked upstream as slsa-framework/slsa-github-generator#4000 (c-ares
  # hit the same thing and adopted this same workaround). The
  # upload-provenance job below attaches the provenance instead, using
  # "gh release upload", which resolves drafts by pending tag name -- the
  # same mechanism the cosign bundle upload already uses.
  #
  # The generator MUST be referenced by tag, not SHA: its internal builder
  # checkout fails with "Invalid ref" when pinned to a commit, hence the
  # zizmor suppression.
  provenance:
    name: SLSA provenance
    needs: release
    # Run whenever the release job itself succeeded, on every entry path.
    # Without this, the implicit success() makes GitHub skip this job when
    # any job in the transitive needs chain was skipped -- which is exactly
    # what happens on a manual tag push (preflight and verify are skipped)
    # or a dispatch with skip_longtest=true (verify is skipped), even though
    # release runs via its always() condition. See
    # https://github.com/actions/runner/issues/2205
    if: always() && needs.release.result == 'success'
    permissions:
      # What the generator's internal jobs declare, minus the contents:write
      # its (now-bypassed) uploader needed. upload-provenance grants itself
      # contents:write instead.
      actions: read # generator reads the workflow path
      id-token: write # generator signs the provenance with OIDC
      contents: read # generator declares this; it no longer uploads anything
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0 # zizmor: ignore[unpinned-uses]
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      upload-assets: false

  # Attach the signed provenance to the DRAFT release ourselves (see the
  # provenance job comment for why the generator's uploader can't).
  # The generator uploads the signed provenance as a run artifact named
  # after its provenance-name output; download it and attach it with
  # "gh release upload --clobber", which resolves the draft by pending tag
  # name and is idempotent across re-runs. "test -f" first so a missing
  # artifact fails loudly instead of uploading nothing.
  upload-provenance:
    name: Attach provenance to draft release
    needs: [release, provenance]
    if: always() && needs.release.result == 'success' && needs.provenance.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the provenance asset to the draft release
    steps:
      - name: Download the signed provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0, same major as the generator's upload-artifact v4.6.0
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}

      - name: Upload provenance to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_NAME: ${{ needs.provenance.outputs.provenance-name }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -eu
          test -f "$PROVENANCE_NAME"
          gh release upload "$RELEASE_TAG" "$PROVENANCE_NAME" --clobber
